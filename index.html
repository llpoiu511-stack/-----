<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberLab | البرمجة والأمن السيبراني</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070b12;
      color: #e8eef7;
      line-height: 1.7;
    }

    header {
      background: #0b111c;
      border-bottom: 1px solid #1c2a3d;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #42f5a7;
    }

    nav a {
      color: #c7d2e2;
      text-decoration: none;
      margin-right: 20px;
    }

    nav a:hover {
      color: #42f5a7;
    }

    .hero {
      padding: 90px 7%;
      text-align: center;
      background:
        radial-gradient(circle at center, #10263a 0%, #070b12 55%);
    }
