<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>CyberLab</title></head>
<body style="background:#020712;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif">
<div style="background:#0a1a2e;border:1px solid gold;padding:30px;border-radius:15px;text-align:center;width:90%;max-width:320px">
<h2 style="color:gold">CyberLab</h2>
<input type="password" id="pass" placeholder="كلمة السر" style="width:100%;padding:12px;border-radius:20px;margin:15px 0;text-align:center">
<button onclick="login()" style="width:100%;padding:12px;border-radius:20px;background:gold;font-weight:bold;cursor:pointer">دخول</button>
<p id="err" style="color:red;display:none;margin-top:10px">خطأ</p>
</div>
<script>
function login(){
  var p = document.getElementById('pass').value.trim();
  console.log(p);
  if(p === "899299292"){
    document.body.innerHTML = `
    <div style="color:white;padding:20px;max-width:1000px;margin:auto">
      <h1>✅ تم الدخول بنجاح</h1>
      <h2>لوحة التحكم السيبرانية</h2>
      <div style="display:grid;grid-template-columns:200px 1fr;gap:15px;margin-top:20px">
        <div style="border:1px solid #1e3a5f;padding:10px;border-radius:10px">
          <div>🛡️ الرئيسية</div><div>🎯 فحص الثغرات</div><div>🌐 تحليل الشبكة</div><div>🔒 التشفير</div><div>👁️ مراقبة الأنشطة</div>
        </div>
        <div style="border:1px solid #1e3a5f;padding:20px;border-radius:10px;text-align:center">
          <h3>أدوات الاختراق الأخلاقي</h3>
          <p>التهديدات: 12 | الفحوصات: 03 | الحماية: 98%</p>
        </div>
      </div>
    </div>`;
  }else{
    document.getElementById('err').style.display='block';
    document.getElementById('err').innerText = 'كلمة السر خطأ، كتبت: ' + p;
  }
}
</script>
</body>
</html>
