<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER LAB</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{min-height:100vh;background:#02060f;color:#fff;background-image:radial-gradient(circle at 50% 20%,rgba(0,140,255,0.22),transparent 60%)}
.page{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.page.active{display:flex}
.card{width:92%;max-width:420px;background:rgba(255,255,255,0.06);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,0.13);border-radius:28px;padding:38px 32px;box-shadow:0 0 50px rgba(0,140,255,0.18)}
.logo{text-align:center;font-size:32px;font-weight:800;text-shadow:0 0 15px #0090ff}
.sub{color:#8bb9ff;text-align:center;font-size:13px;margin:10px 0 28px}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.45);color:#fff;outline:none}
.btn{width:100%;margin-top:26px;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#0090ff,#00d4ff);color:#000;font-weight:800;cursor:pointer}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding:14px 18px;background:rgba(255,255,255,0.05);border-radius:16px}
.item{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);padding:18px 20px;border-radius:18px;margin-bottom:14px;cursor:pointer;display:flex;justify-content:space-between;transition:.3s}
.item:hover{border-color:#0090ff;transform:translateX(-5px);box-shadow:0 0 28px rgba(0,144,255,0.35)}
.c{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:18px;margin:14px 0}
.back{color:#5ab8ff;cursor:pointer;margin-bottom:12px;display:inline-block}
.logout{color:#ff9a9a!important}
.book-container{height:70vh;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:18px}
.book-page{scroll-snap-align:start;min-height:65vh;background:linear-gradient(180deg,#fffef2,#f2ead0);color:#1e1e1e;border-radius:14px;padding:22px 18px 45px;margin-bottom:16px;position:relative;border-right:5px solid #7a4d00}
.page-head{font-family:'Amiri',serif;font-weight:700;font-size:18px;margin-bottom:12px;border-bottom:2px solid #7a4d00;padding-bottom:6px}
.page-text{font-family:'Amiri',serif;font-size:16px;line-height:1.8;white-space:pre-line}
.page-num{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#7a4d00;font-size:12px}
</style>
</head>
<body>

<div id="p1" class="page active">
  <div class="card">
    <div class="logo">CYBER LAB</div>
    <div class="sub">لوحة التحكم السيبرانية</div>
    <input class="input" id="usernameInput" placeholder="اسم المستخدم">
    <input class="input" style="margin-top:12px" type="password" placeholder="••••">
    <button type="button" class="btn" id="loginBtn">دخول آمن →</button>
  </div>
</div>

<div id="p2" class="page"><div class="wrap">
  <div class="header"><div>لوحة التحكم</div><div>● متصل</div></div>
  <!-- زر الوعي الأمني الجديد -->
  <div class="item" onclick="openPage(7)" style="border-color:#00ff88;background:rgba(0,255,136,0.12)"><div>📖 الوعي الأمني</div><span>↗</span></div>
  <div class="item" onclick="openPage(3)"><div>قسم البرامج</div><span>↗</span></div>
  <div class="item" onclick="openPage(4)"><div>قسم أدوات الهكر</div><span>↗</span></div>
  <div class="item" onclick="openPage(5)"><div>كودات حماية تيليجرام</div><span>↗</span></div>
  <div class="item" onclick="openPage(6)"><div>ادوات الواي فاي</div><span>↗</span></div>
  <div class="item logout" onclick="openPage(1)"><div>الخروج</div><span>×</span></div>
</div></div>

<!-- صفحة كتاب الوعي الأمني -->
<div id="p7" class="page"><div class="wrap">
<span class="back" onclick="openPage(2)">← رجوع للوحة التحكم</span>
<h2 style="text-align:center;margin-bottom:6px;text-shadow:0 0 12px #00ff88">📖 الوعي الأمني</h2>
<p style="text-align:center;color:#8bb9ff;font-size:11px;margin-bottom:14px">اسحب للأسفل - كل سحبة صفحة جديدة</p>

<div class="book-container">
  <div class="book-page" style="background:linear-gradient(135deg,#001a0d,#0a2a12);color:#a0ffc8;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-right-color:#00ff88"><h1 style="font-size:36px;color:#00ff88">الوعي الأمني</h1><p style="margin-top:10px">دليلك للحماية الرقمية</p><div class="page-num" style="color:#00ff88">الغلاف</div></div>
