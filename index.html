<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab - Premium Cybersecurity Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
  body{background:#050a14;color:#c9e8ff}

  /* --- شاشة الدخول الفخمة --- */
  #loginScreen{
    width:100%;height:100vh;
    background:url('cyberlab_luxury_banner.webp') no-repeat center center;
    background-size:cover;display:flex;justify-content:center;align-items:center;position:relative;
  }
  #loginScreen .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6)}
  .login-box{
    position:relative;z-index:2;background:rgba(10,25,50,0.88);
    border:1px solid #d4af37;border-radius:20px;padding:35px 30px;width:90%;max-width:380px;text-align:center;
    box-shadow:0 0 40px rgba(212,175,55,0.4);backdrop-filter:blur(10px);
  }
  .login-box h2{color:#FFD700;font-size:28px;text-shadow:0 0 10px #FFD700}
  .login-box p{color:#8dd8ff;font-size:11px;letter-spacing:3px;margin:10px 0 20px}
  .login-box input{width:100%;padding:13px;border-radius:30px;border:1px solid #2a5a8a;background:rgba(0,0,0,0.6);color:#fff;text-align:center;font-size:16px;outline:none;margin-bottom:15px}
  .login-box button{width:100%;padding:12px;border-radius:30px;border:none;background:linear-gradient(90deg,#d4af37,#FFD700);color:#000;font-weight:bold;font-size:16px;cursor:pointer}
  .error{color:#ff5c5c;font-size:13px;margin-top:10px;display:none}

  /* --- لوحة التحكم نفس الصورة بالضبط --- */
  #dashboardScreen{display:none;padding:20px;max-width:1250px;margin:0 auto}
  .header{display:flex;justify-content:space-between;align-items:center;border:1px solid #1e3a5f;padding:15px 20px;border-radius:12px;background:rgba(10,20,40,0.9);box-shadow:0 0 20px rgba(0,150,255,0.2)}
  .header h1{font-size:26px;color:#eaf6ff;text-shadow:0 0 10px #00aaff}
  .header span{font-size:12px;opacity:0.8}
  .badge{padding:6px 12px;border-radius:20px;background:#0a1a2e;border:1px solid #1e5a8a;margin-right:8px;font-size:11px}
  .main{display:grid;grid-template-columns:270px 1fr;gap:20px;margin-top:20px}
  .sidebar{border:1px solid #1e3a5f;border-radius:12px;padding:12px;background:rgba(8,18,35,0.95)}
  .btn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;margin:9px 0;background:linear-gradient(180deg,#0f2747,#0a1c34);border:1px solid #2a5a8a;border-radius:10px;color:#bfe3ff;cursor:pointer;text-align:right;transition:0.2s;box-shadow:inset 0 0 10px rgba(0,180,255,0.15);
