<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab</title>
<style>
body{margin:0;background:#01040a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
.box{width:92%;max-width:380px;background:#0c1c3a;border:1px solid #d4af37;border-radius:20px;padding:30px;text-align:center}
input{width:100%;padding:14px;border-radius:30px;border:1px solid #2a5a8a;background:#000e1f;color:#fff;text-align:center;font-size:18px;letter-spacing:2px;margin-top:15px}
button{width:100%;padding:14px;margin-top:15px;border-radius:30px;border:none;background:gold;color:#000;font-weight:bold;font-size:17px;cursor:pointer}
#err{color:#ff5c5c;margin-top:10px;display:none}
#ok{color:#5cffb0;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="box">
<h2 style="color:gold">CyberLab</h2>
<p style="font-size:11px;letter-spacing:4px;color:#7ec8ff">PREMIUM CYBERSECURITY LAB</p>
<input type="text" id="p" inputmode="numeric" placeholder="899299292" autocomplete="off">
<button onclick="check()">دخول المختبر 🔓</button>
<div id="err"></div>
<div id="ok">✅ صحيح - جاري الدخول...</div>
<p style="margin-top:15px;font-size:11px;opacity:0.5">اكتب: 899299292</p>
</div>
<script>
function toEnglishNumbers(str){
  return str.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\s/g,'').trim();
}
function check(){
  let raw = document.getElementById('p').value;
  let cleaned = toEnglishNumbers(raw);
  console.log("كتبت:", raw, "بعد التنظيف:", cleaned);
  if(cleaned === "899299292"){
    document.getElementById('ok').style.display='block';
    document.getElementById('err').style.display='none';
    setTimeout(()=>{
      document.body.innerHTML = `
      <div style="padding:12px;max-width:1200px;margin:auto;width:100%;color:#d4f0ff">
        <div style="border:1px solid #1e3a5f;border-radius:16px;padding:16px;background:#0a1a2e;display:flex;justify-content:space-between"><b>لوحة التحكم السيبرانية</b><span style="color:#5cffb0">● متصل</span></div>
        <div style="display:grid;grid-template-columns:260px 1fr;gap:12px;margin-top:12px">
          <div style="border:1px solid #1e3a5f;border-radius:16px;padding:12px;background:#0a1a2e">
            <div style="padding:12px;background:#0f2747;border:1px solid #00bfff;border-radius:10px;color:#fff">🛡️ الرئيسية</div>
            <div style="padding:12px;margin-top:6px;background:#0f2747;border-radius:10px">🎯 فحص الثغرات</div>
            <div style="padding:12px;margin-top:6px;background:#0f2747;border-radius:10px">🌐 تحليل الشبكة</div>
          </div>
          <div style="border:1px solid #1e3a5f;border-radius:16px;padding:20px;background:#0a1a2e;text-align:center">
            <h2 style="color:#d6efff">أدوات الاختراق الأخلاقي</h2>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px">
              <div style="border:1px solid #2a5a8a;padding:15px;border-radius:12px"><div>التهديدات</div><div style="font-size:36px;color:#8dd8ff">12</div></div>
              <div style="border:1px solid #2a5a8a;padding:15px;border-radius:12px"><div>الفحوصات</div><div style="font-size:36px;color:#8dd8ff">03</div></div>
              <div style="border:1px solid #2a5a8a;padding:15px;border-radius:12px"><div>الحماية</div><div style="font-size:36px;color:#8dd8ff">98%</div></div>
            </div>
            <p style="margin-top:20px;color:#5cffb0">✅ تم الدخول بنجاح - هذه هي النسخة الكاملة بعد التأكد من كلمة السر</p>
          </div>
        </div>
      </div>`;
    },800);
  }else{
    let e = document.getElementById('err');
    e.style.display='block';
    e.innerHTML = `❌ خطأ - أنت كتبت: "${raw}" <br> الصحيح هو: 899299292 <br> <small>تأكد أنك تكتب بالإنجليزي بدون مسافات</small>`;
    document.getElementById('ok').style.display='none';
  }
}
document.getElementById('p').addEventListener('keypress',e=>{if(e.key==='Enter')check()});
</script>
</body>
</html>
