<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوعي الأمني - CYBER LAB</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{min-height:100vh;background:#02060f;color:#fff;background-image:radial-gradient(circle at 50% 10%,rgba(0,255,136,0.15),transparent 60%)}
.page{display:none;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.page.active{display:flex}
.card{width:92%;max-width:420px;background:rgba(255,255,255,0.06);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,0.13);border-radius:28px;padding:32px}
.logo{text-align:center;font-size:30px;font-weight:800;text-shadow:0 0 15px #00ff88}
.btn{width:100%;margin-top:20px;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#00ff88,#00d4ff);color:#000;font-weight:800;cursor:pointer}
.wrap{width:100%;max-width:500px;display:flex;flex-direction:column}
.item{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);padding:18px 20px;border-radius:18px;margin-bottom:14px;cursor:pointer;display:flex;justify-content:space-between}
.back{color:#5ab8ff;cursor:pointer;margin-bottom:10px;display:inline-block}
.book-wrapper{width:100%;max-width:520px}
.book-head{text-align:center;margin-bottom:14px}
.book-container{height:78vh;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:18px;scrollbar-width:none}
.book-container::-webkit-scrollbar{display:none}
.book-page{scroll-snap-align:start;min-height:74vh;background:linear-gradient(180deg,#fffef2,#f2ead0);color:#1e1e1e;border-radius:14px;padding:26px 20px 50px;margin-bottom:18px;position:relative;box-shadow:0 12px 30px rgba(0,0,0,0.6),inset 0 0 60px rgba(139,90,0,0.07);border-right:6px solid #7a4d00}
.book-page.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#0a2a12,#001a0d);color:#d4ffea;border-right:6px solid #00ff88}
.book-page.cover h1{font-family:'Amiri',serif;font-size:42px;color:#00ff88;text-shadow:0 0 20px #00ff88;margin-bottom:15px}
.page-head{font-family:'Amiri',serif;font-size:19px;font-weight:700;color:#000;margin-bottom:14px;border-bottom:2px solid #7a4d00;padding-bottom:8px}
.page-text{font-family:'Amiri',serif;font-size:16.5px;line-height:1.9;white-space:pre-line}
.tag{color:#0066cc;font-weight:700;margin-top:12px;display:inline-block}
.page-num{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-family:'Amiri',serif;color:#7a4d00;font-size:13px}
.joinBtn{display:block;text-align:center;margin-top:18px;padding:11px;background:#000;color:#f2ead0;border-radius:10px;text-decoration:none;font-weight:700}
</style>
</head>
<body>

<div id="p1" class="page active"><div class="card"><div class="logo">CYBER LAB</div><p style="text-align:center;color:#8bb9ff;font-size:12px;margin:10px 0">كتاب الوعي الأمني</p><input id="usernameInput" placeholder="اسم المستخدم" style="width:100
