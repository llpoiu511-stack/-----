<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab - شغال</title>
</head>
<body style="background:white; color:black; font-family:sans-serif; text-align:center; padding-top:80px;">

<h1 style="color:#0a2a5a;">CyberLab شغال الآن ✅</h1>
<p>مختبر الأمن السيبراني</p>

<div style="margin:30px auto; max-width:300px; border:2px solid #0a2a5a; padding:20px; border-radius:15px;">
<input type="password" id="pass" placeholder="كلمة السر 899299292" style="width:100%; padding:12px; text-align:center; border-radius:20px; border:1px solid #ccc;">
<br><br>
<button onclick="check()" style="width:100%; padding:12px; border-radius:20px; background:#0a2a5a; color:white; font-weight:bold; cursor:pointer;">دخول المختبر</button>
<p id="msg" style="margin-top:10px;"></p>
</div>

<script>
function check(){
  var p = document.getElementById('pass').value;
  if(p === "899299292"){
    document.getElementById('msg').innerHTML = "✅ صحيح - جاري الدخول...";
    document.body.innerHTML += "<div style='margin-top:30px; border:1px solid #ccc; padding:20px; max-width:800px; margin:auto;'><h2>لوحة التحكم السيبرانية</h2><p>🛡️ الرئيسية | 🎯 فحص الثغرات | 🌐 تحليل الشبكة | 🔒 التشفير | 👁️ المراقبة | 📄 التقارير</p><p>التهديدات: 12 | الفحوصات: 03 | الحماية: 98%</p></div>";
  }else{
    document.getElementById('msg').innerHTML = "❌ كلمة السر خطأ";
    document.getElementById('msg').style.color = "red";
  }
}
</script>

</body>
</html>
