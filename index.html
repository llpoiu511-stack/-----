<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">

  <title>CyberLab | البرمجة والأمن السيبراني</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #070b12;
      color: #e8eef7;
      line-height: 1.7;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 11, 18, 0.96);
      border-bottom: 1px solid #1c2a3d;
      padding: 16px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #42f5a7;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 22px;
    }

    nav a {
      color: #c7d2e2;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      color: #42f5a7;
    }

    .hero {
      min-height: 78vh;
      padding: 100px 7%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background:
        radial-gradient(circle at center, #10263a 0%, #070b12 58%);
    }

    .hero-content {
      max-width: 850px;
    }

    .hero h1 {
      color: #42f5a7;
      font-size: clamp(45px, 9vw, 85px);
      margin-bottom: 15px;
      text-shadow: 0 0 25px rgba(66, 245, 167, 0.35);
    }

    .hero h2 {
      font-size: clamp(22px, 4vw, 34px);
      margin-bottom: 20px;
    }

    .hero p {
      color: #aebbd0;
      font-size: 18px;
      max-width: 700px;
      margin: auto;
    }

    .buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 26px;
      margin: 6px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .primary {
      background: #42f5a7;
      color: #06100b;
    }

    .secondary {
      border: 1px solid #42f5a7;
      color: #42f5a7;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(66, 245, 167, 0.3);
    }

    .section {
      padding: 75px 7%;
    }

    .section-title {
      text-align: center;
      color: #42f5a7;
      font-size: 34px;
      margin-bottom: 40px;
    }
